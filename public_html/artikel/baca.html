<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <!-- Bulletproof fetch setter patch to prevent Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter -->
    <script>
        (function() {
            try {
                var originalFetch = window.fetch;
                var currentFetch = originalFetch;
                Object.defineProperty(window, 'fetch', {
                    configurable: true,
                    enumerable: true,
                    get: function() { return currentFetch; },
                    set: function(val) { currentFetch = val; }
                });
            } catch (e) {
                // Safe fallback
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | DIGILARAS</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="https://digilaras.com/artikel/{{SLUG}}">
    <meta property="og:title" content="{{TITLE}} | DIGILARAS">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:image" content="{{COVER_IMAGE}}">
    <meta property="og:url" content="https://digilaras.com/artikel/{{SLUG}}">
    <meta property="og:type" content="article">
    <meta property="article:published_time" content="{{DATE}}">
    <meta property="article:author" content="{{AUTHOR}}">
    <meta property="article:section" content="{{CATEGORY}}">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23022c22'/><path d='M30 70V30h20c15 0 25 10 25 20s-10 20-25 20H30zm10-10h10c10 0 15-5 15-10s-5-10-15-10H40v20z' fill='%23facc15'/></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-agency-900 text-slate-300 antialiased overflow-x-hidden">

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="pt-32 pb-24">
        <article class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Breadcrumbs -->
            <nav class="flex items-center gap-2 text-xs uppercase tracking-wider text-slate-400 font-bold mb-6">
                <a href="/" class="hover:text-agency-500 transition-colors">Beranda</a>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
                <a href="/artikel/" class="hover:text-agency-500 transition-colors">Artikel</a>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
                <span class="text-agency-500 text-gradient truncate max-w-[200px] md:max-w-xs">{{TITLE}}</span>
            </nav>

            <!-- Article Header -->
            <header class="mb-8">
                <span class="inline-block bg-agency-600 text-white text-xs font-extrabold uppercase px-3 py-1.5 rounded-full tracking-wider mb-4">
                    {{CATEGORY}}
                </span>
                <h1 class="text-3xl md:text-4xl lg:text-5xl font-black text-white uppercase tracking-tight leading-tight mb-6">
                    {{TITLE}}
                </h1>
                
                <div class="flex flex-wrap items-center gap-6 text-sm text-slate-400 uppercase tracking-wider font-semibold border-b border-white/10 pb-6">
                    <span class="flex items-center gap-2"><i class="fa-regular fa-calendar-days text-agency-500"></i> {{FORMATTED_DATE}}</span>
                    <span class="flex items-center gap-2"><i class="fa-regular fa-user text-agency-500"></i> {{AUTHOR}}</span>
                    <span class="flex items-center gap-2"><i class="fa-regular fa-clock text-agency-500"></i> 4 Menit Baca</span>
                </div>
            </header>

            <!-- Cover Image -->
            <div class="rounded-2xl overflow-hidden aspect-[21/9] w-full mb-10 shadow-card border border-white/5">
                <img src="{{COVER_IMAGE}}" alt="{{TITLE}}" class="w-full h-full object-cover" referrerPolicy="no-referrer">
            </div>

            <!-- Content Area -->
            <div class="prose prose-invert prose-yellow max-w-none text-slate-300 leading-relaxed space-y-6 text-base md:text-lg">
                {{CONTENT}}
            </div>

            <!-- Footer / CTA inside article -->
            <div class="mt-16 p-8 bg-agency-950/60 border border-white/10 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-6">
                <div>
                    <h4 class="text-xl font-bold text-white uppercase mb-2">Ingin Meningkatkan Omset Bisnis Anda?</h4>
                    <p class="text-slate-300 text-sm max-w-md">Konsultasikan gratis kebutuhan digital marketing dan pembuatan website Anda bersama tim ahli DIGILARAS.</p>
                </div>
                <a href="https://digilaras.com/contact/" class="inline-flex items-center justify-center px-6 py-3 bg-agency-600 hover:bg-agency-500 text-white hover:text-agency-950 font-bold rounded-full transition-all duration-300 uppercase tracking-widest text-sm shadow-glow shrink-0">
                    Konsultasi Gratis <i class="fa-solid fa-arrow-right ml-2"></i>
                </a>
            </div>
        </article>

        <!-- Recommended Articles Section -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-24 pt-16 border-t border-white/10">
            <h2 class="text-2xl md:text-3xl font-black text-white uppercase tracking-tight mb-10 text-center md:text-left">
                Rekomendasi <span class="text-gradient">Artikel</span> Lainnya
            </h2>
            <div id="recommended-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Recommended articles will load here dynamically -->
                <div class="col-span-full text-center text-slate-400 py-6">
                    <i class="fa-solid fa-circle-notch animate-spin text-2xl text-agency-500"></i>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/assets/js/main.js"></script>
    <script>
        // Helper to get bulletproof API URL based on environment
        function getApiUrl(endpoint, slug = '') {
            // Node/Vite development environment always runs on port 3000 or AI Studio container domains
            const isNodeDev = window.location.hostname.includes('ais-dev') || 
                              window.location.hostname.includes('ais-pre') || 
                              window.location.port === '3000';
            if (isNodeDev) {
                return slug ? `/api/articles/${slug}` : '/api/articles';
            } else {
                // On PHP environments (production Hostinger, local XAMPP/Apache, php -S),
                // we dynamically calculate the basePath of the subdirectory to ensure compatibility on localhost (e.g. localhost/digilaras/public_html/)
                const pathname = window.location.pathname;
                const index = pathname.toLowerCase().indexOf('/artikel');
                let basePath = '';
                if (index !== -1) {
                    basePath = pathname.substring(0, index);
                }
                return slug ? `${basePath}/api.php?slug=${slug}` : `${basePath}/api.php`;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const currentSlug = "{{SLUG}}";
            const recommendedGrid = document.getElementById('recommended-grid');
            
            if (recommendedGrid) {
                fetch(getApiUrl('articles'))
                    .then(res => res.json())
                    .then(articles => {
                        // Filter out current article and limit to 3 recommendations
                        const recommendations = articles
                            .filter(a => a.slug !== currentSlug)
                            .slice(0, 3);
                            
                        if (recommendations.length === 0) {
                            recommendedGrid.innerHTML = `
                                <div class="col-span-full text-center py-6 text-slate-400 text-sm font-medium">
                                    Tidak ada rekomendasi artikel lain saat ini.
                                </div>
                            `;
                            return;
                        }
                        
                        recommendedGrid.innerHTML = recommendations.map(article => `
                            <article class="bg-agency-950/60 border border-white/10 rounded-2xl overflow-hidden hover:border-agency-500/40 group hover:shadow-card transition-all duration-300 flex flex-col h-full">
                                <div class="relative overflow-hidden aspect-video">
                                    <img src="${article.coverImage || 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600'}" alt="${article.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" referrerPolicy="no-referrer">
                                    <span class="absolute top-4 left-4 bg-agency-600 text-white text-xs font-extrabold uppercase px-3 py-1.5 rounded-full tracking-wider z-10">
                                        ${article.category}
                                    </span>
                                </div>
                                <div class="p-6 flex flex-col flex-grow">
                                    <div class="flex items-center gap-4 text-xs text-slate-400 mb-3 uppercase tracking-wider font-semibold">
                                        <span><i class="fa-regular fa-calendar-days text-agency-500 mr-1.5"></i>${new Date(article.date).toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
                                    </div>
                                    <h3 class="text-lg font-bold text-white mb-3 group-hover:text-agency-500 transition-colors uppercase tracking-tight line-clamp-2">
                                        <a href="/artikel/${article.slug}" class="outline-none">${article.title}</a>
                                    </h3>
                                    <p class="text-slate-300 text-sm leading-relaxed mb-6 flex-grow line-clamp-2">
                                        ${article.description}
                                    </p>
                                    <div class="mt-auto">
                                        <a href="/artikel/${article.slug}" class="inline-flex items-center text-sm font-extrabold text-agency-500 group-hover:translate-x-1.5 transition-transform uppercase tracking-wider gap-2 outline-none">
                                            Baca <i class="fa-solid fa-arrow-right-long"></i>
                                        </a>
                                    </div>
                                </div>
                            </article>
                        `).join('');
                    })
                    .catch(err => {
                        console.error('Error fetching recommendations:', err);
                        recommendedGrid.innerHTML = '';
                    });
            }
        });
    </script>
</body>
</html>
